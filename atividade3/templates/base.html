{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}HotelSystem{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <i class="bi bi-building"></i>
          </div>
          <span>HotelSystem</span>
        </div>

        <nav class="sidebar-nav">
          <p class="menu-label">MENU</p>

          <a href="{% url 'listar_pessoas' %}" class="nav-link">
            <i class="bi bi-people"></i>
            <span>Pessoas</span>
          </a>

          <a href="{% url 'listar_apartamentos' %}" class="nav-link">
            <i class="bi bi-door-closed"></i>
            <span>Apartamentos</span>
          </a>

          
         <a href="{% url 'listar_hospedagens' %}" class="nav-link">
           <i class="bi bi-calendar-check"></i>
           <span>Hospedagens</span>
        </a>

        </nav>

        <div class="sidebar-footer">
          <a href="#" class="nav-link">
            <i class="bi bi-gear"></i>
            <span>Configurações</span>
          </a>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-title">
            {% block page_heading %}
            <h1>HotelSystem</h1>
            {% endblock %}
          </div>
        </header>

        <section class="page-content">
          {% block content %} {% endblock %}
        </section>
      </main>
    </div>

    <script src="{% static 'js/configuracoes.js' %}"></script>
  </body>
</html>
