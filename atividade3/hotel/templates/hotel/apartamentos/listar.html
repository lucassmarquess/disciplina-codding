<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos</title>
</head>
<body>
    <h1>Lista de Apartamentos</h1>
    <a href="{% url 'cadastrar_apartamento' %}">Cadastrar</a>
    {% for apartamento in apartamentos %}
        <p>
            {{ apartamento.id }} -
            {{ apartamento.numeracao }} -
            {{ apartamento.preco_diaria }} -
            {{ apartamento.tipo }} -
            {{ apartamento.status }} 
            <a href="{% url 'editar_apartamento' apartamento.id %}">Editar</a>
            <form method="POST" action="{% url 'excluir_apartamento' apartamento.id %}" onsubmit="return confirm('Tem certeza que deseja inativar esse apartamento?')" >
                {% csrf_token %}
                <button type="submit">Excluir</button>
            </form>
        </p>
    {% empty %}
        <p>Nenhum apartamento cadastrado</p>
    {% endfor %}
</body>
</html>
