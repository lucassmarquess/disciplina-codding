<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas</title>
</head>
<body>
    <h1>Lista de Pessoas</h1>

    {% for pessoa in pessoas %}
        <p>
            {{ pessoa.nome }} -
            {{ pessoa.cpf }} -
            {{ pessoa.contato }}
            
            <a href="{% url "editar_pessoa" pessoa.id %}">Editar</a>
            <form method="POST" action="{% url 'excluir_pessoa' pessoa.id %}" style="display: inline;" onsubmit="return confirm('Tem certeza que deseja inativar esta pessoa?');">

                {% csrf_token %}

                <button type="submit">Excluir</button>
            </form>
        </p>
    {% empty %}
        <p>Nenhuma pessoa cadastrada.</p>   
    {% endfor %}
</body>
</html>
